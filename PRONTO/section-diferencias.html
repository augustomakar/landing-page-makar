<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .panel-diferenciais {
            background-color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel-diferenciais-titulo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding-bottom: 70px;
        }

        .panel-diferenciais p {
            font-size: 3.8rem;
            font-weight: lighter;
        }

        .panel-diferenciais span {
            color: gray;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .panel-diferenciais-detalhamento {
            display: flex;
            justify-content: space-between;
            padding: 0 150px;
            gap: 60px;
        }

        .panel-diferenciais-detalhamento-itens {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .panel-diferenciais-detalhamento-itens p {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: rgb(29, 27, 27);
        }

        .panel-diferenciais-detalhamento-itens span {
            font-size: 1rem;
            font-weight: lighter;
            letter-spacing: normal;
            text-align: center;
        }

      @media (max-width:600px) {
        .panel-diferenciais-detalhamento {
            /* display: flex; */
            /* justify-content: space-between; */
            flex-direction: column;
            padding: 10px;
            gap: 60px;
        }

        .panel-diferenciais {
            padding: 10px;
        }

        .panel-diferenciais-titulo {
            text-align: center;

        }
      }

    </style>


</head>
<body>

    <section class="panel-diferenciais">
        <div class="panel-diferenciais-titulo">
            <p>Nós fazemos mais por você!</p>
            <span>COMO PRESTAMOS NOSSOS SERVIÇOS</span>
        </div>

        <div class="panel-diferenciais-detalhamento">
            <div class="panel-diferenciais-detalhamento-itens">
                <img src="./assets/lixeira.png" alt="" />
                <p>Zero Papel</p>
                <span>
                    Operamos de forma digital o que nos torna
                    ecológicos.
                </span>
            </div>
            <div class="panel-diferenciais-detalhamento-itens">
                <img src="./assets/engrenagem.png" alt="" />
                <p>Processos</p>
                <span>
                    Processos inteligentes e automatizados evitam
                    retrabalho.
                </s>
            </div>
            <div class="panel-diferenciais-detalhamento-itens">
                <img src="./assets/celular.png" alt="" />
                <p>Digital</p>
                <span>
                    Nossa plataforma pode ser acessada por
                    Smartphones
                </p>
            </div>
        </div>
    </section>
</body>
</html>
