<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<style>
			.box-apresentacao {
				padding: 110px;
				display: flex;
				flex-direction: column;
				gap: 30px;
				color: white;
				background-color: gray;
			}

			.texto-maior {
				font-size: 3.8rem;
				font-weight: 500;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
			}

			.texto-maior span {
				font-weight: normal;
				color: chartreuse;
			}

			.texto-menor {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				font-size: 1.1rem;
				letter-spacing: 2px;
			}

			.box-apresentacao-botoes {
				padding-top: 25px;
				display: flex;
				justify-content: center;
				gap: 20px;
			}

			.box-apresentacao-botoes button {
				width: 186px;
				height: 57px;
				background-color: blue;
				outline: none;
				border: none;
				border-radius: 30px;
				color: white;
				font-weight: 600;
				font-size: 1rem;
			}

			.box-apresentacao-botoes button:hover {
				background-color: blueviolet;
			}

			@media (max-width: 600px) {
				.box-apresentacao {
					padding: 20px;
					text-align: center;
				}
			}
		</style>
	</head>
	<body>
		<section class="box-apresentacao">
			<div class="texto-maior">
				<p>Contabilidade Gerencial Completa.</p>
				<p>
					Planos A partir de
					<span>R$ 89,00</span>
				</p>
			</div>
			<div class="texto-menor">
				<p>
					Especializado em prestadores de serviço do Simples Nacional.
				</p>
				<p>Ajudamos pequenos empreendedores a crescer!</p>
			</div>
			<div class="box-apresentacao-botoes">
				<button>Mostrar Planos</button>
				<button>Começar Já!</button>
			</div>
		</section>
	</body>
</html>
