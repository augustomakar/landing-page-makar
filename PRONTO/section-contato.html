<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			div {
				/* border: 1px  solid black; */
			}

			.container {
				display: flex;
				/* flex-direction: row; */
				padding: 30px 200px;
                background-color: aquamarine;
                background-image: url('./assets/background/background-contato2.jpg');
                gap: 150px
			}

			.panel-left {
				display: flex;
				flex-direction: column;
				align-items: center;
                justify-content: center;
				width: 40%;
				gap: 30px;
                color: white;
			}

			.panel-right {
				display: flex;
                flex-direction: column;
				width: 60%;
			}

            .box-form {
                display: flex;
                flex-direction: column;
                background-color: white;
                padding: 40px;
                border-radius: 10px;
            }

            .box-form form  {
                display: flex;
                flex-direction: column;
                gap:30px;
            }

            .box-form-inputs {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .box-form-inputs div {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }


        .p1 {
            font-size: 2.5rem;
            font-weight: lighter;
        }

        .p2 { 
            font-size: 1.2rem;
            font-weight: 500;
        }

        input,
        textarea {
            background-color: #f5f5f5;
            padding: 10px;
            border: none;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 5px;
        }

        input:focus,
        textarea:focus {
            border: 1px blueviolet solid;
            border-radius: 5px;
            outline: none;
        }

        
        button {
            background-color: blueviolet;
            color: white;
            width: 100%;
            border: none;
            border-radius: 5px;
            padding: 10px;
            height: 50px;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
        }

         button:hover,
        button:focus {
            background-color: darkorchid;
            font-weight: bold;
            font-size: 1.1rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
        }
        


        /* Make a one column-layout instead of three-column layout */
        @media (max-width: 600px) {
        .container {
            flex-direction: column;
            padding: 50px;
            gap:60px;
        }

        .panel-left {
            width: 100%;
        }

        .panel-right {
            width: 100%;
        }

        
        }

		</style>
	</head>
	<body>
		<div class="container">
			<di class="panel-left">
				<p class="p1">CONTATO</p>
				<p class="p2">PORTO ALEGRE/RS</p>
				<p class="p2">atendimento@makarcontabilidade.com.br</p>
				<p class="p2">MAKAR CONTABILIDADE LTDA</p>
			</di class="p1"v>
			<div class="panel-right">
				<div class="box-form">
					<form
						action=""
						class="">
						<div class="box-form-inputs">
                            <div>
                                <label for="nome">Nome</label>
                                <input
                                    type="text"
                                    name="nome"
                                    placeholder="Digite seu nome (obrigatório)"
                                    required />
                            </div>
                            <div>
                                <label for="telefone">Telefone</label>
                                <input
                                    type="text"
                                    name="telefone"
                                    placeholder="Digite seu telefone (obrigatório)"
                                    required />
                            </div>
                            <div>
                                <label for="e-mail">E-mail</label>
                                <input
                                    type="email"
                                    name="e-mail"
                                    placeholder="Digite seu email (obrigatório)"
                                    required />


                            </div>
                            <div>
                                <label for="mensagem">Mensagem</label>
                                <textarea
                                    name="mensagem"
                                    required>
                                </textarea>


                            </div>
						</div>

						<button>Enviar</button>
					</form>
			</div>
		</div>
	</body>
</html>
