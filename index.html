<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />

        <script type="module" src="./src/componentes/MeuCard.js"></script>
        <script type="module" src="./src/componentes/Header.js"></script>
        <script type="module" src="./src/componentes/Apresentacao.js"></script>
        <script type="module" src="./src/componentes/Diferenciais.js"></script>
        <script type="module" src="./src/componentes/Custos.js"></script>
        <script type="module" src="./src/componentes/Servicos.js"></script>
        <script type="module" src="./src/componentes/Precos.js"></script>
        <script type="module" src="./src/componentes/Contato.js"></script>
        <script type="module" src="./src/componentes/Footer.js"></script>
    </head>

    <body>
        <div class="hero-section">
            <comp-header></comp-header>
            <comp-apresentacao></comp-apresentacao>
            <comp-diferenciais></comp-diferenciais>
            <comp-custos></comp-custos>
            <comp-servicos id="servicos"></comp-servicos>
            <comp-precos id="precos"></comp-precos>
            <comp-contato id="contato"></comp-contato>
            <comp-footer></comp-footer>
        </div>

        <!-- SCRIPT JAVASCRIPT PARA O EFEITO DE ROLAGEM -->
        <script>
            window.addEventListener('componentePronto', () => {
                // 1. Pega a tag do componente customizado
                const componente = document.querySelector('comp-header');
                // 2. Entra no Shadow DOM dele e busca o ID lá dentro
                const header =
                    componente.shadowRoot.getElementById('main-header');

                // const header = document.getElementById('main-header');

                window.addEventListener('scroll', () => {
                    // Se a rolagem vertical passar de 50 pixels
                    if (window.scrollY > 50) {
                        // alert(header);
                        header.classList.add('scroll-active');
                    } else {
                        header.classList.remove('scroll-active');
                    }
                });
            });
        </script>
    </body>
</html>
